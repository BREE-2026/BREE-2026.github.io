<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BREE · Camera Tuner</title>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <style>
    :root{color-scheme:dark;--bg:#17201f;--panel:#202b29;--line:#465552;--paper:#f1efe8;--steel:#9db0ac;--signal:#d7785d}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,sans-serif;color:var(--paper)}
    body{overflow:hidden}#tuner-canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab}#tuner-canvas:active{cursor:grabbing}
    .tuner-panel{position:fixed;z-index:3;left:24px;top:24px;width:340px;max-height:calc(100vh - 48px);overflow:auto;padding:22px;background:rgba(23,32,31,.95);border:1px solid var(--line)}
    h1{margin:0;font:500 28px/1.05 Georgia,serif;letter-spacing:-.03em}p{margin:10px 0 20px;color:#b6c1bd;font-size:12px;line-height:1.5}.hint{color:var(--steel);font-size:11px}
    .control{display:grid;grid-template-columns:90px 1fr 55px;align-items:center;gap:9px;margin:12px 0}.control label{font:500 10px/1.2 monospace;letter-spacing:.06em;text-transform:uppercase;color:#c5cfcb}.control output{font:11px monospace;color:var(--steel);text-align:right}
    input[type=range]{width:100%;accent-color:var(--signal)}
    .rule{border-top:1px solid var(--line);margin:18px 0}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.buttons button{border:1px solid var(--line);padding:10px 12px;background:transparent;color:var(--paper);font:500 10px monospace;cursor:pointer}.buttons button.primary{background:var(--signal);border-color:var(--signal);color:#1b2422}.buttons button:hover{filter:brightness(1.12)}#status{min-height:32px;margin:14px 0 0;padding-top:10px;border-top:1px solid var(--line);font:11px/1.45 monospace;color:var(--steel)}
    @media(max-width:700px){.tuner-panel{left:12px;top:12px;width:calc(100vw - 24px);max-height:48vh;padding:16px}.control{margin:8px 0}}
  </style>
</head>
<body>
  <canvas id="tuner-canvas"></canvas>
  <aside class="tuner-panel">
    <h1>BREE camera tuner</h1>
    <p>拖拽画布旋转视角，滚轮改变距离；也可以用滑杆精确调节。<br><span class="hint">当前页面只写入候选参数，不会自动覆盖首页。</span></p>
    <div class="control"><label for="cam-x">camera X</label><input id="cam-x" type="range" min="-1" max="6" step="0.01"><output id="cam-x-out"></output></div>
    <div class="control"><label for="cam-y">camera Y</label><input id="cam-y" type="range" min="-1" max="4" step="0.01"><output id="cam-y-out"></output></div>
    <div class="control"><label for="cam-z">camera Z</label><input id="cam-z" type="range" min="2" max="8" step="0.01"><output id="cam-z-out"></output></div>
    <div class="control"><label for="look-x">look-at X</label><input id="look-x" type="range" min="-1" max="1" step="0.01"><output id="look-x-out"></output></div>
    <div class="control"><label for="look-y">look-at Y</label><input id="look-y" type="range" min="-1" max="1" step="0.01"><output id="look-y-out"></output></div>
    <div class="control"><label for="yaw">model yaw</label><input id="yaw" type="range" min="-30" max="30" step="0.1"><output id="yaw-out"></output></div>
    <div class="control"><label for="scale">model scale</label><input id="scale" type="range" min="0.65" max="1.35" step="0.01"><output id="scale-out"></output></div>
    <div class="control"><label for="model-x">model X</label><input id="model-x" type="range" min="-0.5" max="1.2" step="0.01"><output id="model-x-out"></output></div>
    <div class="control"><label for="model-y">model Y</label><input id="model-y" type="range" min="-0.8" max="0.8" step="0.01"><output id="model-y-out"></output></div>
    <div class="rule"></div>
    <div class="buttons"><button id="reset">RESET</button><button id="copy">COPY CONFIG</button><button id="confirm" class="primary">确认候选角度</button></div>
    <div id="status">正在加载 SLDASM 模型…</div>
  </aside>
  <script type="module" src="assets/js/camera-tuner.js?v=20260917-2"></script>
</body>
</html>
